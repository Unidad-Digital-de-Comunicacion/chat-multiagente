# Overrides de desarrollo: se aplican automáticamente junto con docker-compose.yml
# (docker compose up ya los mezcla). Montan el código fuente para hot-reload y
# corren gunicorn con --reload para no tener que reconstruir la imagen en cada
# cambio.

services:
  # En desarrollo los datos de Postgres viven en una carpeta del host
  # (`./data/postgres`, ignorada por git), no en el volumen nombrado
  # `pgdata` del compose base: así un `docker compose down -v` o un
  # `docker volume prune` no se lleva la base puesta (pasó el 2026-11-02).
  # Mismo destino que en docker-compose.yml, así que este bind mount
  # REEMPLAZA al volumen `pgdata` (compose mezcla `volumes` por ruta
  # destino). Producción (sin override) sigue usando el volumen nombrado.
  db:
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  core:
    volumes:
      - jwt_keys:/app/keys
      - ./services/core:/app
      # Mismo criterio que `db`: los archivos subidos (avatares, miniaturas)
      # viven en `./data/media` del host, no en el volumen `media_files`.
      # Reemplaza a ese volumen (mismo destino, /mediafiles en la raíz del
      # contenedor — NO bajo /app: un bind mount del host anidado bajo el
      # ./services/core:/app de arriba deja carpetas fantasma en Windows).
      - ./data/media:/mediafiles
    environment:
      - GUNICORN_RELOAD=true
      # 1 solo worker bloqueaba TODOS los requests mientras uno estaba
      # esperando el backoff de `conversations.channel_gateway_client.
      # enviar_con_reintentos` (hasta ~3s por request fallido) — confirmado
      # en producción 2026-09-19. Con 3, un request lento ya no le come el
      # único worker disponible a los demás. ~115MB en uso hoy con 1
      # worker / límite de 512MB del servicio (docker-compose.yml) — 3
      # entra cómodo.
      - GUNICORN_WORKERS=3

  # Los 5 de acá abajo pisan el CMD del Dockerfile (gunicorn + UvicornWorker,
  # sin `--reload`) con el mismo gunicorn pero CON `--reload` — mismo
  # binario/worker class que producción, sólo se agrega el watch de
  # archivos, en vez de volver a un `uvicorn` suelto distinto del que
  # corre en producción.
  channel-gateway:
    volumes:
      - ./services/channel-gateway:/app
    command: [
      "gunicorn", "app.main:app", "--worker-class", "uvicorn.workers.UvicornWorker",
      "--bind", "0.0.0.0:8000", "--workers", "2", "--reload",
    ]

  conversation-engine:
    volumes:
      - ./services/conversation-engine:/app
    # 1 solo worker acá también — ver el comentario del Dockerfile
    # (`GestorConexiones` en memoria de proceso, no hay backing compartido).
    command: [
      "gunicorn", "app.main:app", "--worker-class", "uvicorn.workers.UvicornWorker",
      "--bind", "0.0.0.0:8000", "--workers", "1", "--reload",
    ]

  analytics:
    volumes:
      - ./services/analytics:/app
    command: [
      "gunicorn", "app.main:app", "--worker-class", "uvicorn.workers.UvicornWorker",
      "--bind", "0.0.0.0:8000", "--workers", "2", "--reload",
    ]

  webchat:
    volumes:
      - ./services/webchat:/app
    command: [
      "gunicorn", "app.main:app", "--worker-class", "uvicorn.workers.UvicornWorker",
      "--bind", "0.0.0.0:8000", "--workers", "2", "--reload",
    ]

  admin-panel:
    # Usa el stage intermedio del Dockerfile (el que tiene Node) en vez del
    # nginx final, para correr el dev server de Vite con hot-reload. El
    # mapeo de puertos "3000:80" se hereda tal cual del compose base: Vite
    # escucha adentro en el 80 sólo en este modo dev.
    build:
      target: build
    environment:
      # En la imagen final (Dockerfile) esto es un build ARG porque Vite lo
      # incrusta en build-time — acá en cambio corre `vite dev`, que lee
      # `import.meta.env.VITE_*` de una env var de verdad en cada arranque
      # del proceso, no en build-time (no hay build en este modo).
      - VITE_CORE_API_URL=${ADMIN_PANEL_CORE_API_URL:-http://localhost:8001}
    volumes:
      - ./frontend/admin-panel:/app
      - admin_panel_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]

volumes:
  admin_panel_node_modules:
