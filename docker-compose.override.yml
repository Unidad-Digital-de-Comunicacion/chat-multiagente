# Overrides de desarrollo: se aplican automáticamente junto con docker-compose.yml
# (docker compose up ya los mezcla). Montan el código fuente para hot-reload y
# corren gunicorn con --reload para no tener que reconstruir la imagen en cada
# cambio.

services:
  core:
    volumes:
      - jwt_keys:/app/keys
      - ./services/core:/app
    environment:
      - GUNICORN_RELOAD=true
      # 1 solo worker bloqueaba TODOS los requests mientras uno estaba
      # esperando el backoff de `conversations.channel_gateway_client.
      # enviar_con_reintentos` (hasta ~3s por request fallido) — confirmado
      # en producción 2026-09-19. Con 3, un request lento ya no le come el
      # único worker disponible a los demás. ~115MB en uso hoy con 1
      # worker / límite de 512MB del servicio (docker-compose.yml) — 3
      # entra cómodo.
      - GUNICORN_WORKERS=3

  channel-gateway:
    volumes:
      - ./services/channel-gateway:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  conversation-engine:
    volumes:
      - ./services/conversation-engine:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  operators-desk:
    volumes:
      - ./services/operators-desk:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  analytics:
    volumes:
      - ./services/analytics:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  webchat:
    volumes:
      - ./services/webchat:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  admin-panel:
    # Usa el stage intermedio del Dockerfile (el que tiene Node) en vez del
    # nginx final, para correr el dev server de Vite con hot-reload. El
    # mapeo de puertos "3000:80" se hereda tal cual del compose base: Vite
    # escucha adentro en el 80 sólo en este modo dev.
    build:
      target: build
    environment:
      # En la imagen final (Dockerfile) esto es un build ARG porque Vite lo
      # incrusta en build-time — acá en cambio corre `vite dev`, que lee
      # `import.meta.env.VITE_*` de una env var de verdad en cada arranque
      # del proceso, no en build-time (no hay build en este modo).
      - VITE_CORE_API_URL=${ADMIN_PANEL_CORE_API_URL:-http://localhost:8001}
    volumes:
      - ./frontend/admin-panel:/app
      - admin_panel_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]

volumes:
  admin_panel_node_modules:
