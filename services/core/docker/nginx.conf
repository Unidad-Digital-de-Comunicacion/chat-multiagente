server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location /health {
        # Nginx contesta directo (no hace falta pasar por gunicorn/Django
        # para el healthcheck del contenedor).
        default_type application/json;
        return 200 '{"status": "ok"}';
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/mediafiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        # `$host` no incluye el puerto (a diferencia de `$http_host`) — con
        # `$host` a secas, Django ve el request como si hubiera llegado a
        # "localhost" sin puerto, y `request.build_absolute_uri()` arma URLs
        # de avatar rotas (ej. "http://localhost/media/..." en vez de
        # "http://localhost:8001/media/..."). Ver DJANGO_ALLOWED_HOSTS/CORS.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
