[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:gunicorn]
command=gunicorn config.wsgi:application
    --bind 127.0.0.1:8000
    --workers %(ENV_GUNICORN_WORKERS)s
    --timeout 60
    %(ENV_GUNICORN_EXTRA_ARGS)s
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; Cierre automático de conversaciones inactivas (conversations.management.
; commands.cerrar_conversaciones_inactivas) — no hay Celery/Redis en este
; proyecto (CLAUDE.md §1), así que en vez de un scheduler aparte esto es
; un loop simple bajo el mismo supervisord que ya corre gunicorn/nginx.
; `autorestart=true` reinicia el loop entero si `sh` muere por lo que sea;
; el `manage.py` de adentro corre y termina solo en cada vuelta, no queda
; un proceso Django viviendo entre corridas.
[program:cierre_inactividad]
command=sh -c "while true; do python manage.py cerrar_conversaciones_inactivas; sleep %(ENV_CIERRE_INACTIVIDAD_INTERVALO_SEGUNDOS)s; done"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

; Detector de incidentes (app `monitoring`): lee las líneas nuevas de los logs
; de todos los servicios (./logs del host, montado en LOGS_TODOS_DIR), chequea
; la salud de los endpoints y avisa por mail. Mismo patrón que el de arriba.
[program:vigilar_incidentes]
command=sh -c "while true; do python manage.py vigilar_incidentes; sleep %(ENV_MONITOREO_INTERVALO_SEGUNDOS)s; done"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
