# Scan-only mode: run the anti-slop rules against any project WITHOUT adding
# files to it. The plugin loads from this clone (paths resolve relative to
# this config file), so the target repo stays untouched. When the anti-slop-py
# package is already installed in the environment, skip this config and use
# the entry points directly (`flake8 --enable-extensions=ASD,ASF ...`);
# loading both copies double-reports each finding. From the target:
#
#   uvx --with . --from flake8 flake8 --config <clone>/configs/flake8-scan.ini src tests
#
# or with plain flake8 installed anywhere:
#
#   flake8 --config <clone>/configs/flake8-scan.ini src tests
#
# The framework groups are off_by_default plugins, so they need
# enable-extensions besides select. Drop them from both lines when the target
# does not use pydantic/fastapi.

[flake8]
select = ASP,ASD,ASF
enable-extensions = ASD,ASF

[flake8:local-plugins]
extension =
    ASP = anti_slop.checker:AntiSlopChecker
    ASD = anti_slop.pydantic.checker:AntiSlopPydanticChecker
    ASF = anti_slop.fastapi.checker:AntiSlopFastapiChecker
paths =
    ../src
