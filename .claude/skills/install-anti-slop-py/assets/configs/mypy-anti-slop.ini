# anti-slop-py layer 2: mypy strict flags.
# Merge into the target repository's mypy configuration (mypy.ini,
# setup.cfg [mypy], or pyproject [tool.mypy]). Explicit flags rather than
# `strict = True` so they merge cleanly with an existing profile.

[mypy]
# no-unknown-* / no-unsafe-dictionary-type: Any anywhere is a finding,
# including nested generics and aliases that Ruff ANN401 cannot see.
disallow_any_explicit = True
disallow_any_generics = True
disallow_untyped_defs = True
warn_return_any = True

# no-widen-then-assert (partial) and hygiene around assertions.
warn_redundant_casts = True
warn_unused_ignores = True
