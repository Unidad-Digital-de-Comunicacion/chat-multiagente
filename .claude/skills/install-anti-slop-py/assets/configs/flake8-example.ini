# anti-slop-py layer 3: the vendored Flake8 plugin as a Ruff companion.
# Copy to `.flake8` (or merge into setup.cfg/tox.ini). Flake8 does not read
# pyproject.toml. `select = ASP` keeps Flake8 scoped to anti-slop rules so
# Ruff remains the primary linter.

[flake8]
select = ASP
# Framework groups are opt-in and off by default: when pydantic/fastapi is a
# direct dependency, extend `select` (e.g. `select = ASP,ASD,ASF`), add
# `enable-extensions = ASD,ASF`, and keep the matching extension lines below;
# otherwise delete all three. The Pydantic group pairs with the
# flake8-pydantic package (PYD codes); add PYD to select when installed.
# Uncomment to permit isinstance/hasattr inside TypeGuard/TypeIs functions:
# anti_slop_allow_typeguards = True

[flake8:local-plugins]
extension =
    ASP = anti_slop.checker:AntiSlopChecker
    ASD = anti_slop.pydantic.checker:AntiSlopPydanticChecker
    ASF = anti_slop.fastapi.checker:AntiSlopFastapiChecker
paths =
    ./tools/flake8
