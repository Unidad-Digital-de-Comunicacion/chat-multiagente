# anti-slop-py Pydantic group, layer 2: the official Pydantic mypy plugin.
# Merge only when `pydantic` is a direct dependency (or on explicit request).
# If a `plugins` line already exists, append to it instead of replacing.

[mypy]
plugins = pydantic.mypy

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
