x-fastapi-common: &fastapi-common
  environment:
    - CORE_BASE_URL=http://core:80
    - JWT_PUBLIC_KEY_URL=http://core:80/api/auth/jwks/
  depends_on:
    db:
      condition: service_healthy
    core:
      condition: service_healthy
  # Stubs livianos (Fase 0): con esto alcanza y de sobra. Subir cuando cada
  # servicio tenga lógica real (Fase 3+).
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 256M
      reservations:
        memory: 128M

services:
  db:
    image: postgres:16
    # `timestamptz` se sigue guardando internamente en UTC siempre (esto no
    # cambia eso) — sólo cambia con qué huso se MUESTRA en una sesión
    # (`now()`, `\d` en psql, etc.), que por default de la imagen es UTC.
    # Django ya convierte a `TIME_ZONE` (`America/Argentina/Buenos_Aires`,
    # ver settings.py) para lo que sirve a los usuarios — esto es para que
    # una consulta manual por psql también se lea en hora de Argentina.
    command: ["postgres", "-c", "timezone=America/Argentina/Buenos_Aires"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_READONLY_USER=${POSTGRES_READONLY_USER}
      - POSTGRES_READONLY_PASSWORD=${POSTGRES_READONLY_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/db/init-schemas.sh:/docker-entrypoint-initdb.d/init-schemas.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

  # Django + DRF. Dentro del contenedor corren nginx (puerto 80, sirve
  # estáticos/media y hace de proxy) y gunicorn (127.0.0.1:8000, no expuesto),
  # coordinados por supervisord — ver services/core/docker/.
  core:
    build: ./services/core
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=core
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_PRIVATE_KEY_PATH=${JWT_PRIVATE_KEY_PATH}
      - JWT_PUBLIC_KEY_PATH=${JWT_PUBLIC_KEY_PATH}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - FRONTEND_URL=${FRONTEND_URL}
      - CHANNEL_GATEWAY_PUBLIC_URL=${CHANNEL_GATEWAY_PUBLIC_URL}
      - CHANNEL_GATEWAY_INTERNAL_URL=${CHANNEL_GATEWAY_INTERNAL_URL:-http://channel-gateway:8000}
      - CONVERSATION_ENGINE_INTERNAL_URL=${CONVERSATION_ENGINE_INTERNAL_URL:-http://conversation-engine:8000}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
    volumes:
      - jwt_keys:/app/keys
      - media_files:/app/mediafiles
      # Documentos técnicos que `platform_admin.DocumentoTecnicoView` sirve
      # desde "Plataforma > Manuales y API" del Admin Panel — de sólo
      # lectura, la fuente sigue viviendo en la raíz del repo (docs/ y
      # UDCOperadorAPP/AGENTS.md), no se duplica adentro de services/core.
      # A propósito FUERA de /app (no /app/docs_repo): docker-compose.
      # override.yml monta ./services/core:/app entero para hot-reload en
      # dev, y anidar un bind mount del host bajo OTRO bind mount del host
      # ahí adentro hace que Docker Desktop en Windows deje archivos/
      # carpetas vacíos fantasma en services/core/ (visto y limpiado una
      # vez — no lo repitas). Como mount de nivel raíz del contenedor, sin
      # relación de anidamiento con /app, no pasa.
      - ./docs:/docs_repo:ro
      - ./UDCOperadorAPP/AGENTS.md:/agents_android.md:ro
    ports:
      - "8001:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  channel-gateway:
    build: ./services/channel-gateway
    <<: *fastapi-common
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=channel_gateway
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN}
      - CORE_SERVICE_TOKEN=${CORE_SERVICE_TOKEN}
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  conversation-engine:
    build: ./services/conversation-engine
    <<: *fastapi-common
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=conversation_engine
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      # Ver el comentario de CONVERSATION_ENGINE_SERVICE_TOKEN en
      # .env.example — mismo valor, nombre de variable distinto porque acá
      # es "el secreto que comparto con Core" (mismo patrón que usa
      # channel-gateway para su propio CORE_SERVICE_TOKEN).
      - CORE_SERVICE_TOKEN=${CONVERSATION_ENGINE_SERVICE_TOKEN}
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  operators-desk:
    build: ./services/operators-desk
    <<: *fastapi-common
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=operators_desk
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CONVERSATION_ENGINE_URL=http://conversation-engine:8000
    ports:
      - "8004:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  analytics:
    build: ./services/analytics
    <<: *fastapi-common
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME_CORE_READONLY=${POSTGRES_DB}
      - DB_USER_READONLY=${POSTGRES_READONLY_USER}
      - DB_PASSWORD_READONLY=${POSTGRES_READONLY_PASSWORD}
    ports:
      - "8005:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  webchat:
    build: ./services/webchat
    <<: *fastapi-common
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=webchat
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      # Mismo patrón que CONVERSATION_ENGINE_SERVICE_TOKEN en .env.example
      # — "el secreto que comparto con Core" del lado de Webchat. Sin esto,
      # Core le devuelve 401 a cualquier mensaje entrante real.
      - CORE_SERVICE_TOKEN=${WEBCHAT_SERVICE_TOKEN}
    ports:
      - "8006:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles: ["webchat"] # no arranca por defecto: docker compose --profile webchat up

  admin-panel:
    build:
      context: ./frontend/admin-panel
      args:
        - VITE_CORE_API_URL=${ADMIN_PANEL_CORE_API_URL:-http://localhost:8001}
        - VITE_CONVERSATION_ENGINE_URL=${ADMIN_PANEL_CONVERSATION_ENGINE_URL:-http://localhost:8003}
    ports:
      - "3000:80"
    depends_on:
      core:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  # Cloudflare Tunnel: expone un dominio propio hacia adentro de esta red de
  # docker-compose sin IP pública ni abrir puertos en el router — hace falta
  # para que Meta pueda llamar de verdad a los webhooks de Channel Gateway
  # (sección 4.2/9 de docs/CONTEXTO_PROYECTO.md: `webhook_url` hoy apunta a
  # `http://localhost:8002`, que Meta no puede alcanzar). Modo "remotely-
  # managed" (el más simple: un solo token, todo el ruteo hostname -> servicio
  # se configura en el dashboard de Cloudflare Zero Trust, no acá) — ver el
  # README de la imagen (https://hub.docker.com/r/cloudflare/cloudflared)
  # para el modo alternativo con `config.yml` + `credentials.json` si en
  # algún momento hace falta manejar el ruteo desde el propio repo.
  #
  # No arranca por defecto (mismo patrón que `webchat`): `docker compose
  # --profile tunnel up -d cloudflared`. Setup, una vez, en el dashboard de
  # Cloudflare Zero Trust (Networks > Tunnels > Create a tunnel > Cloudflared):
  #   1. Crear el túnel, copiar el token que da el paso "Install and run a
  #      connector" (el comando `cloudflared tunnel run --token eyJ...`, sólo
  #      el valor de --token) y pegarlo en `.env` como CLOUDFLARE_TUNNEL_TOKEN.
  #   2. En "Public Hostname", agregar el dominio propio (ej.
  #      webhooks.midominio.com) apuntando a `http://channel-gateway:8000`
  #      (el nombre del servicio en esta red de docker-compose, no localhost
  #      ni una IP — cloudflared vive adentro de la misma red y resuelve DNS
  #      de docker-compose).
  #   3. Actualizar `CHANNEL_GATEWAY_PUBLIC_URL` en `.env` al dominio nuevo
  #      (ej. https://webhooks.midominio.com) para que `Canal.webhook_url`
  #      en el Admin Panel muestre la URL pública real, no localhost.
  #
  # El mismo túnel/token sirve para exponer Conversation Engine (WebSocket
  # de tiempo real, `services/conversation-engine`) — un SEGUNDO "Public
  # Hostname" en este mismo túnel (en udcchat.com.ar: realtime.udcchat.
  # com.ar), Service Type HTTP, apuntando a `conversation-engine:8000`
  # (Cloudflare hace el upgrade a WebSocket solo, no hay nada más que
  # tildar). No hace falta otro `CLOUDFLARE_TUNNEL_TOKEN` ni otro
  # contenedor — actualizar `CONVERSATION_ENGINE_PUBLIC_URL` Y
  # `ADMIN_PANEL_CONVERSATION_ENGINE_URL` en `.env` a ese dominio
  # (`wss://`/`https://` respectivamente, ver .env.example).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      channel-gateway:
        condition: service_healthy
    profiles: ["tunnel"] # no arranca por defecto: docker compose --profile tunnel up
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 32M

volumes:
  pgdata:
  jwt_keys:
  media_files:
